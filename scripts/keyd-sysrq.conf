# keyd configuration: a host-side "Fn" layer that turns <Fn>+Delete into SysRq.
#
# Use this when you want a simulated SysRq key without changing the firmware.
# Pick any key as the fake Fn (here: Caps Lock). While holding it, Delete
# becomes Print/SysRq (KEY_SYSRQ). The base Delete key stays Delete.
#
# If you want the REAL Fn key instead, use VIA instead of keyd: open
# usevia.app, authorize the V5, go to the FN layer, click the Delete key, and
# assign Print Screen. The real Fn never reaches the host, so only VIA (the
# firmware) can make Fn+Delete emit SysRq.
#
# Emergency reboot (REISUB) — the kernel fires the command on each keydown
# while SysRq is active, so this works in one motion:
#   hold Alt, hold <Fn>, hold Delete, then tap: R E I S U B, release Alt.
#
# Install:
#   sudo pacman -S keyd
#   sudo install -Dm644 scripts/keyd-sysrq.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Replace "capslock" with any key you are willing to repurpose as the fake Fn
# (e.g. "rightctrl"). kernel.sysrq is already 1 on Garuda.

[ids]
# Keychron V5 Max (wired)
3434:0950

[main]
capslock = layer(fn)

[fn]
delete = print
