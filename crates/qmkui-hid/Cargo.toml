[package]
name = "qmkui-hid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Native hidapi transport. Kept off by default so `cargo test` builds without
# the system hidapi/libusb toolchain; enabled by the Tauri/native shell.
hidapi-transport = ["dep:hidapi"]

[dependencies.hidapi]
version = "2.6"
optional = true
