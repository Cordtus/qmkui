[package]
name = "qmkui"
version = "0.1.0"
description = "Device-first QMK/VIA keyboard reader and project workbench"
edition = "2021"
license = "MIT"
repository = "https://github.com/Cordtus/qmkui"

[lib]
name = "qmkui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
qmkui-hid = { path = "../../../crates/qmkui-hid", features = ["hidapi-transport"] }
qmkui-build = { path = "../../../crates/qmkui-build" }
qmkui-flash = { path = "../../../crates/qmkui-flash" }
qmkui-core = { path = "../../../crates/qmkui-core" }
